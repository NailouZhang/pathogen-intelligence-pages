name: Deploy Pathogen Intelligence Pages v17.4

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pathogen-intelligence-public-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate public-only static tree
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s public/index.html
          python - <<'PY'
          from pathlib import Path
          forbidden_names = {
              "review_vocabulary.json", "retrieval_vocabulary.json", "translation_glossary.json",
              "provider_quota_daily.json", "publisher.env", "seed.yaml", "profile_bootstrap.md",
          }
          forbidden_suffixes = {".py", ".pyc", ".pem", ".key"}
          forbidden_parts = {"data/audit", "config/vocabularies", "src/", "scripts/", ".git/"}
          problems = []
          for path in Path("public").rglob("*"):
              if not path.is_file():
                  continue
              rel = path.as_posix()
              if path.name in forbidden_names or path.suffix in forbidden_suffixes or any(part in rel for part in forbidden_parts):
                  problems.append(rel)
          if problems:
              raise SystemExit("Forbidden private files in public tree:\n" + "\n".join(problems))
          print("PUBLIC_TREE_OK")
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
