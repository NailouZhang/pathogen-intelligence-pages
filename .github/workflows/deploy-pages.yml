name: Deploy Pathogen Intelligence Pages v17.4-r4.1

on:
  repository_dispatch:
    types: [pages-data-updated]
  workflow_dispatch:
    inputs:
      source_branch:
        description: Machine-owned static-data branch to deploy
        required: false
        default: pages-data
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pathogen-intelligence-public-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve machine-owned data branch
        id: source
        shell: bash
        env:
          DISPATCH_BRANCH: ${{ github.event.client_payload.branch }}
          INPUT_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -Eeuo pipefail
          BRANCH="${DISPATCH_BRANCH:-${INPUT_BRANCH:-pages-data}}"
          [[ "$BRANCH" != main ]] || {
            echo "::error::Generated Pages data must never be deployed from main."
            exit 2
          }
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "::error::Invalid source branch: $BRANCH"
            exit 2
          }
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout generated static data
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.branch }}
          fetch-depth: 1

      - name: Validate public-only static tree
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .pages-data-branch
          test -s public/index.html
          python - <<'PY'
          from pathlib import Path
          forbidden_names = {
              "review_vocabulary.json", "retrieval_vocabulary.json", "translation_glossary.json",
              "provider_quota_daily.json", "publisher.env", "seed.yaml", "profile_bootstrap.md",
          }
          forbidden_suffixes = {".py", ".pyc", ".pem", ".key"}
          forbidden_parts = {"data/audit", "config/vocabularies", "src/", "scripts/", ".git/"}
          problems = []
          for path in Path("public").rglob("*"):
              if not path.is_file():
                  continue
              rel = path.as_posix()
              if path.name in forbidden_names or path.suffix in forbidden_suffixes or any(part in rel for part in forbidden_parts):
                  problems.append(rel)
          if problems:
              raise SystemExit("Forbidden private files in public tree:\n" + "\n".join(problems))
          print("PUBLIC_TREE_OK")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
